<!doctype html>
<!-- lp remote — mini-mode-style phone client. A faithful port of the
     desktop's mini mode: album art in the middle with the unified
     ControlPanel over its bottom edge (always visible here — no hover on a
     phone), tracklist and lyrics as in-flow accordion panes that push the
     art rather than cover it (landscape: tracklist left / lyrics right,
     exactly mini mode's arrangement; portrait: tracklist from the top,
     lyrics from the bottom, one at a time). The library browser is a left
     drawer. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#121212">
<title>lp</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Stage: three flex slots — tracklist pane | art | lyrics pane. The flex
     direction flips with orientation (row in landscape, column in
     portrait); the panes are zero-size accordions until their body class
     (tracks-open / lyrics-open) opens them, and the art letterboxes into
     whatever space remains. Each pane carries its own permanent title
     label (mirrors mini mode's #mini-tracklist-title / #mini-lyrics-title,
     distinct from the panel's own title — both kept, by design). -->
<main id="stage">
  <div id="tracklist-pane">
    <div id="tracklist-pane-title" class="pane-title"></div>
    <div id="tracklist"></div>
  </div>

  <div id="center">
    <div id="art-area">
      <img id="art" alt="" draggable="false">
      <div id="placeholder"><img src="icon.png" alt=""></div>

      <!-- ControlPanel port (overlay_controls.py): title+heart row,
           time/progress/time row, toggles+transport row. Always visible —
           NOT part of the auto-hiding chrome. Buttons carry lp's own SVG
           icons, injected by app.js. -->
      <div id="panel">
        <div id="panel-title-row">
          <div id="panel-title"></div>
          <button id="fav-btn" aria-label="Favourite"></button>
        </div>
        <div id="seek-row">
          <span id="time-cur">0:00</span>
          <div id="progress" role="slider" aria-label="Seek">
            <div id="progress-track"><div id="progress-fill"></div></div>
          </div>
          <span id="time-len">0:00</span>
        </div>
        <div id="buttons">
          <button id="tracks-btn" class="toggle" aria-label="Tracklist"></button>
          <span class="flex-gap"></span>
          <button id="shuffle-btn" class="toggle" aria-label="Shuffle"></button>
          <button id="prev-btn" aria-label="Previous"></button>
          <button id="play-btn" aria-label="Play"></button>
          <button id="next-btn" aria-label="Next"></button>
          <button id="repeat-btn" class="toggle" aria-label="Repeat"></button>
          <span class="flex-gap"></span>
          <button id="lyrics-btn" class="toggle" aria-label="Lyrics"></button>
        </div>
      </div>
    </div>
  </div>

  <div id="lyrics-pane">
    <div id="lyrics-pane-title" class="pane-title"></div>
    <div id="lyrics"></div>
  </div>
</main>

<!-- chrome: the two corner buttons auto-hide together after idle -->
<button id="menu-btn" class="chrome" aria-label="Library"></button>
<button id="camera-btn" class="chrome" aria-label="Upload album art from camera"></button>
<input id="camera-input" type="file" accept="image/*" capture="environment" hidden>

<!-- Left drawer: library browser (artists collapse; tap a header to open) -->
<div id="scrim"></div>
<nav id="drawer">
  <div id="drawer-top">
    <input id="filter" type="search" placeholder="Filter albums" autocomplete="off">
    <button id="theme-btn" aria-label="Toggle light/dark"></button>
  </div>
  <div id="album-list"></div>
</nav>

<!-- Token prompt (shown only when unauthorized) -->
<div id="token-screen" hidden>
  <div>
    <p>Enter the access token shown in lp&rsquo;s Remote&nbsp;Access dialog:</p>
    <input id="token-input" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button id="token-go">Connect</button>
    <p id="token-err"></p>
  </div>
</div>

<!-- Camera crop screen: the whole photo fits on screen with an adjustable
     crop box over it — drag inside to move, grab an edge/corner to resize
     (free aspect, starts square) — before it's uploaded as additional
     (non-cover) album art. -->
<div id="crop-screen" hidden>
  <button id="crop-cancel" aria-label="Cancel">&times;</button>
  <div id="crop-frame">
    <img id="crop-img" alt="" draggable="false">
    <div id="crop-box">
      <div class="crop-handle corner" data-handle="nw"></div>
      <div class="crop-handle corner" data-handle="ne"></div>
      <div class="crop-handle corner" data-handle="sw"></div>
      <div class="crop-handle corner" data-handle="se"></div>
      <div class="crop-handle edge" data-handle="n"></div>
      <div class="crop-handle edge" data-handle="s"></div>
      <div class="crop-handle edge" data-handle="w"></div>
      <div class="crop-handle edge" data-handle="e"></div>
    </div>
  </div>
  <p id="crop-hint">Drag the box to move &middot; pull an edge or corner to resize</p>
  <div id="crop-actions">
    <button id="crop-retake">Retake</button>
    <button id="crop-use">Use Photo</button>
  </div>
</div>

<!-- ONE persistent audio element — never recreated, or iOS drops the
     background-audio session -->
<audio id="player" playsinline preload="auto"></audio>

<script src="app.js"></script>
</body>
</html>
